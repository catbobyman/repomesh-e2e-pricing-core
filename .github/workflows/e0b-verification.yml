name: e0b-verification

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  e0b-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository acceptance tests
        run: python scripts/run_tests.py
